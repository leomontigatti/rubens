# Dependabot version updates for the action pins only: minor and patch, one grouped
# PR a week. A pin never needs a code fix beside it, which is what Dependabot cannot
# write. The npm packages are bumped by a weekly T3 scheduled task instead
# (docs/agents/dependency-updates.md), and a major stays a hand-written issue.
#
# `cooldown` keeps a release out of a PR until it is seven days old, zizmor's
# `dependabot-cooldown` floor.
#
# `commit-message` gives each PR a title `check:pr-title` accepts: `ci(deps): …`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
