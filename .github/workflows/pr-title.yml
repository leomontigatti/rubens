# PR-title gate. PRs here are squash-merged, so the title becomes the commit subject
# on `main`: it has to be a conventional commit written in English. `pnpm
# check:pr-title` is the whole rule; this file only feeds it the title.
#
# Its own workflow rather than a job in `ci.yml`, for one reason: it needs `edited`,
# so renaming a title re-runs the gate instead of leaving a red check on a title
# that is now fine. `edited` also fires on body edits, and adding it to `ci.yml`
# would re-run the whole suite on every description change.
#
# Branch protection: `pr-title` is a required context on `main`, alongside `checks`
# and `actions-gate` from `ci.yml`. That is a repo setting outside this repo; this
# file only produces the check.
name: PR title

on:
  pull_request:
    branches: [main]
    # `synchronize` and `reopened` keep the check present on every PR event that
    # produces one, so the required context is never missing; `edited` is the reason
    # this workflow exists.
    types: [opened, edited, reopened, synchronize]

# Reads the repository and nothing else (zizmor `excessive-permissions`).
permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      # The install is needed: the script is TypeScript and runs under `tsx`.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: check:pr-title (conventional prefix, English subject)
        env:
          # Through the environment, never interpolated into `run:`: the title is
          # attacker-controlled text, and `${{ … }}` inside a shell script is the
          # `template-injection` zizmor fails on.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm check:pr-title
