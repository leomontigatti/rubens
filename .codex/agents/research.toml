# Codex wrapper for the research agent. The instructions live in
# `.agents/agents/research.md`. The model matches what a Claude Code session in T3 delegates
# research to (`docs/agents/agent-configuration.md`); change both together.
name = "research"
description = "Resolves a research question against primary sources (official docs, source code, npm registry, specs) and reports the findings back to the session that spawned it. Use for \"quick research\", \"search the web\", wayfinder research tickets and any \"look this up in the docs\" legwork."
model = "gpt-6-luna"
model_reasoning_effort = "medium"
# Live web search: the default cached index can be stale.
web_search = "live"
developer_instructions = "Before anything else, read `.agents/agents/research.md` and follow it: it holds this agent's instructions."
